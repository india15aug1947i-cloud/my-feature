<script>
const D={en:{start:"Start Practice",pdf:"Upload PDF",img:"Upload Image",paste:"Paste Questions",recent:"Recent tests",att:"Attempted",cor:"Correct",acc:"Accuracy",subj:"Subject",none:"No tests yet"},
hi:{start:"प्रैक्टिस शुरू करें",pdf:"PDF अपलोड",img:"इमेज अपलोड",paste:"प्रश्न पेस्ट करें",recent:"हाल के टेस्ट",att:"प्रयास",cor:"सही",acc:"सटीकता",subj:"विषय",none:"अभी कोई टेस्ट नहीं"}};
const SUBJ=["Mathematics","Physics","Chemistry","English","General Test"];
const L=()=>"ABCDEFGH";
const S={view:"home",lang:"hi",qs:[],notes:[],raw:"",busy:null,modal:null,err:"",i:0,ans:{},showTr:false,el:0,paused:false,subj:"Mathematics",
cfg:{c:4,w:-1,u:0,min:30,reveal:"now"},st:{att:0,cor:0},recent:[]};
try{const x=JSON.parse(localStorage.getItem("mf")||"null");if(x){S.st=x.st||S.st;S.recent=x.recent||[];S.lang=x.lang||S.lang}}catch(e){}
const save=()=>{try{localStorage.setItem("mf",JSON.stringify({st:S.st,recent:S.recent,lang:S.lang}))}catch(e){}};
const t=k=>D[S.lang][k];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const go=v=>{S.view=v;S.err="";render()};

/* ---------- parser ---------- */
function parse(txt){
 const qs=[],key={};let cur=null,last=null,inKey=false,junk=0,dup=false;
 const q1=/^\s*(?:Q(?:uestion)?\.?\s*)?(\d{1,3})\s*[\.\):]\s*(.*)$/i,q2=/^\s*Question\s*:\s*(.*)$/i,
 o1=/^\s*\(?([A-Da-d])\s*[\)\.:]\s*(.*)$/,o2=/^\s*Option\s*([A-D1-4])\s*[:\.\)\-]\s*(.*)$/i,
 an=/^\s*(?:Ans(?:wer)?|Correct(?:\s*Answer)?)\s*[:\-]?\s*\(?([A-Da-d1-4])\)?\s*$/i,
 ex=/^\s*(?:Explanation|Solution|Sol)\s*[:\-]\s*(.*)$/i,ak=/answer\s*key|उत्तर\s*कुंजी/i;
 const mk=(n,s)=>{cur={n,q:s,opts:[],ans:null,exp:"",src:null,unv:false,tr:null,flags:[]};qs.push(cur);last="q"};
 const idx=c=>/\d/.test(c)?+c-1:"ABCD".indexOf(c.toUpperCase());
 for(const raw of txt.replace(/\r/g,"").split("\n")){
  const ln=raw.trim();if(!ln)continue;let m;
  if(ak.test(ln)&&ln.length<40){inKey=true;continue}
  if(inKey){for(const k of ln.matchAll(/(\d{1,3})\s*[-:\.\)]\s*\(?([A-Da-d1-4])\)?/g)){const n=+k[1],v=idx(k[2]);if(key[n]!==undefined&&key[n]!==v)dup=true;key[n]=v}continue}
  if(m=ln.match(q2)){mk(qs.length+1,m[1]);continue}
  if(cur&&(m=ln.match(ex))){cur.exp=m[1];last="e";continue}
  if(cur&&(m=ln.match(an))){cur.ans=idx(m[1]);cur.src="key";continue}
  if(cur&&(m=ln.match(o2)||ln.match(o1))){cur.opts[idx(m[1])]=m[2];last="o";continue}
  if(m=ln.match(q1)){mk(+m[1],m[2]);continue}
  if(cur){if(last==="q")cur.q+="\n"+ln;else if(last==="o")cur.opts[cur.opts.length-1]+=" "+ln;else cur.exp+=" "+ln}else junk++;
 }
 qs.forEach(q=>{q.opts=Array.from(q.opts,x=>x||"");
  if(q.ans==null&&key[q.n]!==undefined){q.ans=key[q.n];q.src="key";if(dup)q.flags.push("ambiguous key")}
  if(q.opts.length!==4||q.opts.some(o=>!o))q.flags.push("options≠4 / empty");
  if(q.ans==null)q.flags.push("no answer")});
 return{qs,junk};
}

/* ---------- AI helpers (sample capability) ---------- */
async function smp(){if(S.sm===undefined){try{S.sm=await window.claude.use("sample")}catch(e){S.sm=null}}return S.sm||(S.user?edge():S.gk?gem():null)}
/* Free Gemini fallback: key is typed by the user in Settings and kept only in this browser's localStorage (never in the code) */
function gem(){
 const call=async(p,o)=>{const parts=[{text:p}];
  for(const b of [].concat((o&&o.images)||[])){const d=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result.split(",")[1]);f.onerror=no;f.readAsDataURL(b)});parts.push({inline_data:{mime_type:b.type||"image/jpeg",data:d}})}
  let r;try{r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(S.gm||"gemini-2.5-flash")+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":S.gk},body:JSON.stringify({contents:[{parts}]})})}catch(e){throw{code:"network",message:"Network error. Check your internet connection."}}
  const j=await r.json().catch(()=>({}));
  if(r.status===429)throw{code:"rate_limited",message:"Gemini free limit reached. Wait a minute and retry."};
  if(!r.ok)throw{code:"api",message:(j.error&&j.error.message)||("Gemini API error "+r.status)};
  const c=j.candidates&&j.candidates[0],tx=c&&c.content&&c.content.parts?c.content.parts.map(x=>x.text||"").join(""):"";
  if(!tx)throw{code:"empty",message:"Gemini returned an empty answer."};
  return{text:tx,truncated:false}};
 const s=(p,o)=>call(p,o);
 s.json=async(p,o)=>{const t=(await call(p,o)).text.replace(/```json|```/g,"").trim(),m=t.match(/[\[{][\s\S]*[\]}]/);try{return JSON.parse(m?m[0]:t)}catch(e){throw{code:"invalid_json",message:"AI reply was not valid JSON. Retry."}}};
 s.limits=async()=>({images:{}});return s}
async function testKey(){S.kmsg="Testing…";render();try{await gem()("Reply with the single word OK");S.kmsg="✅ Key works"}catch(e){S.kmsg="❌ "+emsg(e)}render()}
const emsg=e=>e&&e.code==="rate_limited"?"Rate limit hit. Wait a minute and retry.":e&&e.code==="not_granted"?"AI permission denied. Allow it when prompted and retry.":(e&&e.message)||"Unknown error";
async function ocr(blob){
 const s=await smp();if(!s)throw{message:"OCR service unavailable (open this app inside Claude)."};
 const lim=await s.limits();if(!lim.images)throw{message:"Image reading is not enabled for this account."};
 const r=await s("Transcribe ALL multiple-choice questions in this image (Hindi and/or English). Output plain text only, in this exact format per question:\nQ1. question text\nA) ..\nB) ..\nC) ..\nD) ..\nAnswer: X (ONLY if an answer/key is visible; never guess)\nKeep math symbols, matrices and equations as accurately as possible in plain text. No commentary.",{images:[blob],cache:false});
 if(!r.text||r.truncated&&r.text.length<20)throw{message:"Empty OCR result"};return r.text}
async function jsonAI(p){const s=await smp();if(!s)throw{message:"AI unavailable (open this app inside Claude)."};return s.json(p,{cache:false})}
const mathNote="Preserve all math, symbols, matrices, numbers and equations exactly.";
async function translate(idxs,lang){
 const name=lang==="hi"?"Hindi":"English";
 for(let b=0;b<idxs.length;b+=4){const part=idxs.slice(b,b+4);S.busy=`Translating to ${name} ${Math.min(b+4,idxs.length)}/${idxs.length}`;render();
  const data=part.map(i=>({id:i,q:S.qs[i].q,opts:S.qs[i].opts}));
  const r=await jsonAI(`Translate these MCQs to ${name} (source may be Hindi or English). ${mathNote} Keep exactly 4 options in the same order. Return ONLY JSON: [{"id":number,"q":string,"opts":[string,...]}].\n`+JSON.stringify(data));
  if(!Array.isArray(r))throw{message:"Bad translation response"};
  r.forEach(x=>{const q=S.qs[x.id];if(q&&x.q&&Array.isArray(x.opts)&&x.opts.length===q.opts.length)q.tr={q:x.q,opts:x.opts,lang}})}
}
async function verify(idxs){
 for(let b=0;b<idxs.length;b++){const i=idxs[b],q=S.qs[i];S.busy=`AI checking ${b+1}/${idxs.length}`;render();
  const r=await jsonAI(`Solve this MCQ carefully (CUET UG level). ${mathNote} Return ONLY JSON: {"answer":"A|B|C|D|UNSURE","explanation":"short"}. Say UNSURE if not certain.\n`+JSON.stringify({q:q.q,opts:q.opts}));
  const v=r&&"ABCD".indexOf(String(r.answer).toUpperCase());
  if(v>=0){q.ans=v;q.src="ai";q.exp=r.explanation||q.exp;q.flags=q.flags.filter(f=>f!=="no answer")}else if(r&&r.explanation)q.exp=q.exp||"AI unsure: "+r.explanation}
}
async function run(msg,fn){S.busy=msg;S.err="";render();try{await fn();}catch(e){S.err=emsg(e)}S.busy=null;render()}

/* ---------- import ---------- */
function addText(txt,label){
 const r=parse(txt);S.raw=txt;
 if(!r.qs.length){S.notes.push(`${label}: no questions recognised. Original text kept below.`);return false}
 S.qs=S.qs.concat(r.qs);if(r.junk)S.notes.push(`${label}: ${r.junk} unrecognised line(s) before first question were not used (see original text in Paste view).`);return true}
function doPaste(){const v=document.getElementById("pt").value;if(!v.trim()){S.err="Paste some text first.";return render()}
 S.notes=[];if(addText(v,"Pasted text"))go("rev");else{S.err="Format not recognised. Expected: Q1. question / A) .. B) .. C) .. D) .. / Answer: A";S.view="paste";render()}}
function onPdf(el){const f=el.files[0];if(!f)return;S.notes=["File mili: "+f.name+" ("+Math.round(f.size/1024)+" KB)"];
 run("Reading PDF…",async()=>{
  if(!window.pdfjsLib)throw{message:"PDF engine failed to load. Check internet and retry."};
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let all=[],bad=[],scan=0;
  for(let p=1;p<=pdf.numPages;p++){S.busy=`Page ${p}/${pdf.numPages} (scanned page me 30-60 sec lag sakte hain)`;render();
   const pg=await pdf.getPage(p),tc=await pg.getTextContent();let y=null,ln="",ls=[];
   for(const it of tc.items){const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>3){ls.push(ln);ln=""}ln+=it.str;y=yy}ls.push(ln);
   const tx=ls.join("\n").trim();
   if(tx.replace(/\s/g,"").length>=30)all.push(tx);else{scan++;
    try{const vp=pg.getViewport({scale:2}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
     await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
     all.push(await ocr(await new Promise(r=>c.toBlob(r,"image/jpeg",.85))))}catch(e){bad.push(p);S.notes.push(`Page ${p} could not be read: ${emsg(e)}`)}}}
  if(scan)S.notes.push(`${scan} scanned page(s) were read with AI OCR — check for mistakes.`);
  if(bad.length)S.notes.push(`NOT READ: page(s) ${bad.join(", ")}. Upload again to retry.`);

function settings(){const tg=(k,l)=>`<div class=row><span style="flex:1">${l}</span><button class=sm style="min-width:72px" onclick="tgl('${k}')">${S[k]?"ON":"OFF"}</button></div>`,f=(k,l)=>`<div class=row><span style="flex:1">${l}</span><input style="width:90px;flex:none" type=number value="${S.cfg[k]}" oninput="S.cfg.${k}=+this.value;sv()"></div>`;
 return `<div class=top><h1>Settings</h1></div><div class=card>${tg("sound","Sound effects")}${tg("anim","Animations")}
 <div class=row><span style="flex:1">Theme</span><button class=sm onclick="S.theme=S.theme==='dark'?'light':'dark';sv();render()">${S.theme==="dark"?"🌙 Dark":"☀️ Light"}</button></div>
 <div class=row><span style="flex:1">Language / भाषा</span><button class=sm onclick="S.lang=S.lang==='hi'?'en':'hi';sv();render()">${S.lang==="hi"?"हिंदी":"English"}</button></div>
 <div class=row><span style="flex:1">Name</span><input style="width:150px;flex:none" value="${esc(S.name)}" placeholder="Student" oninput="S.name=this.value;sv()"></div></div>
 ${acct()}
 <div class=card><b>Marking scheme &amp; time</b>${f("c","Marks: correct")}${f("w","Marks: wrong")}${f("u","Marks: unattempted")}${f("min","Total time (min)")}</div>
 <div class=card><b>Free Gemini API key (OCR, translation, AI check)</b><div class=mut style="font-size:12px">Create a free key at aistudio.google.com/apikey and paste it here. It is saved only in this browser, never in the code. Google may use free-tier requests to improve its products.</div>
 <input type=password placeholder="Paste API key" value="${esc(S.gk)}" oninput="S.gk=this.value.trim();sv();if(S.gk){S.dg.ai='ok';S.dg.img='ok'}" style="margin-top:8px"><input value="${esc(S.gm)}" oninput="S.gm=this.value.trim();sv()" style="margin-top:8px"><div class=row><button class=sm onclick="testKey()">Test key</button><span class=mut>${esc(S.kmsg||"")}</span></div></div>
 <div class=card><b>Test instructions</b><div class=mut>• One question per screen; tap an option to answer.<br>• Practice shows correct/incorrect instantly; Mock shows answers at the end and lets you change answers.<br>• Use ⚐ Mark and the palette to review; Submit asks for confirmation.<br>• Time up submits automatically.<br>• Questions without a verified answer are not scored.</div></div>
 <button style="width:100%;color:#f87171" onclick="S.modal='reset';render()">Reset progress</button>
 ${S.modal==="reset"?`<div class=ov><div class=card>Erase test history, stats and streak? Bookmarks and settings are kept.<div class=grid style="margin-top:12px"><button onclick="S.modal=null;render()">Cancel</button><button class=pri onclick="resetAll()">Reset</button></div></div></div>`:""}`}
function test(){const T=S.T,q=T[S.i],d=S.showTr&&q.tr?q.tr:q,a=S.ans[S.i],rev=S.run.reveal==="now"&&a!==undefined,ansd=Object.keys(S.ans).length,mk=Object.keys(S.mk).filter(k=>S.mk[k]).length,bk=S.bm.some(b=>b.q===q.q);
 const mo=S.modal==="exit"?`<div class=ov><div class=card>Exit test? Progress will be lost.<div class=grid style="margin-top:12px"><button onclick="S.modal=null;render()">Stay</button><button class=pri onclick="S.modal=null;clearInterval(tm);go('practice')">Exit</button></div></div></div>`
 :S.modal==="sub"?`<div class=ov><div class=card><b>Submit test?</b><div class=mut style="margin:8px 0">Answered ${ansd} · Unanswered ${T.length-ansd} · Marked ${mk}</div><div class=grid><button onclick="S.modal=null;render()">Cancel</button><button class=pri onclick="finish()">Submit</button></div></div></div>`
 :S.modal==="pal"?`<div class=ov onclick="S.modal=null;render()"><div class=card onclick="event.stopPropagation()" style="max-width:380px"><b>Question palette</b><div class=pg>${T.map((_,i)=>`<button class="pc ${i===S.i?"c ":""}${S.mk[i]?"m":S.ans[i]!==undefined?"a":""}" onclick="S.i=${i};S.modal=null;render()">${i+1}</button>`).join("")}</div><div class=mut style="margin-top:8px">🟩 answered · 🟧 marked · ⬜ unanswered</div><button style="width:100%;margin-top:10px" onclick="S.modal=null;render()">Close</button></div></div>`:"";
 return `<div class=row><button class=sm onclick="S.modal='exit';render()">✕</button><b style="flex:1;text-align:center">${S.i+1} / ${T.length}</b><b id=tmr style="color:var(--c)">${fmt(S.left)}</b><button class=sm onclick="S.paused=!S.paused;render()">${S.paused?"▶":"⏸"}</button></div>
 <div class=bar><i style="width:${ansd*100/T.length}%"></i></div>
 ${S.paused?`<div class=card style="text-align:center">Paused — tap ▶ to resume</div>`:`<div class=card><div class=row><span class=tag>${esc(q.sj||S.sj)}</span><span style="flex:1"></span><button class=sm onclick="bmk()">${bk?"🔖 Saved":"🔖 Save"}</button></div><div style="white-space:pre-wrap;font-size:18px">${esc(d.q)}</div></div>
 ${d.opts.map((o,k)=>`<button class="opt ${rev?(k===q.ans?"ok":k===a?"bad":""):a===k?"sel":""}" onclick="pick(${k})"><span class=ol>${L()[k]}</span><span>${esc(o)}</span></button>`).join("")}
 ${rev&&q.ans==null?`<div class=err>No verified answer set — not scored.</div>`:""}${rev&&q.exp?`<div class=card>💡 ${esc(q.exp)}${q.src==="ai"?' <span class=tag>AI suggested</span>':""}</div>`:""}`}

 <div class="grid g3" style="margin-top:10px"><button onclick="S.i--;render()" ${S.i?"":"disabled"}>← Prev</button><button onclick="mark()">${S.mk[S.i]?"⚑ Marked":"⚐ Mark"}</button><button class=pri onclick="S.i++;render()" ${S.i<T.length-1?"":"disabled"}>Next →</button></div>
 <div class=grid style="margin-top:8px"><button onclick="S.modal='pal';render()">▦ Palette</button><button class=pri onclick="S.modal='sub';render()">Submit</button></div>${mo}`}
function res(){const r=S.R,m=(b,l)=>`<div class="card stat"><b>${b}</b><span>${l}</span></div>`;
 return `<div class=top><h1>Result</h1></div><div class="card stat"><svg viewBox="0 0 120 120" width=150 height=150><defs><linearGradient id=gg><stop offset=0 stop-color="#8b5cf6"/><stop offset=1 stop-color="#22d3ee"/></linearGradient></defs><circle cx=60 cy=60 r=52 fill=none stroke="rgba(128,128,160,.25)" stroke-width=10 /><circle id=rg cx=60 cy=60 r=52 fill=none stroke="url(#gg)" stroke-width=10 stroke-linecap=round stroke-dasharray=327 stroke-dashoffset=327 transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.25,1)"/><text x=60 y=66 text-anchor=middle fill=currentColor font-size=22 font-weight=700>${r.acc}%</text></svg>
 <b style="font-size:38px;display:block;animation:pop .6s">${r.score}</b><span>Score out of ${r.max} (+${S.run.c} / ${S.run.w} / ${S.run.u})</span>${r.acc>=80?'<div style="font-size:30px;animation:pop .8s">🎉</div>':""}</div>
 <div class=grid>${m(r.total,"Total")}${m(r.att,"Attempted")}${m(r.cor,"Correct")}${m(r.wr,"Incorrect")}${m(r.un,"Unattempted")}${m(fmt(r.time),"Time taken")}</div>
 ${r.ns?`<div class=err>${r.ns} attempted question(s) had no answer set and were not scored.</div>`:""}${r.ai?`<div class=err>${r.ai} question(s) use unverified AI-suggested answers.</div>`:""}
 <div class=card><b>Your answer / correct</b>${S.T.map((q,i)=>{const a=S.ans[i];return `<div class=row><span>${a===undefined?"➖":q.ans==null?"❔":a===q.ans?"✅":"❌"}</span><span style="flex:1;font-size:14px">${i+1}. ${esc(q.q.slice(0,60))}</span><span class=mut>${a===undefined?"—":L()[a]} / ${q.ans==null?"?":L()[q.ans]}</span></div>`}).join("")}</div>
 <div class=grid><button onclick="startTest(S.T,{mode:S.mode,sj:S.sj,cfg:{reveal:S.run.reveal},min:S.run.min})">Retry</button><button class=pri onclick="go('home')">Home</button></div>`}

const cerr=e=>(e&&(e.message||e.error_description))||"Cloud error";
function wrapJson(s){s.json=async(p,o)=>{const t=(await s(p,o)).text.replace(/```json|```/g,"").trim(),m=t.match(/[\[{][\s\S]*[\]}]/);try{return JSON.parse(m?m[0]:t)}catch(e){throw{code:"invalid_json",message:"AI reply was not valid JSON. Retry."}}};s.limits=async()=>({images:{}});return s}
function edge(){const call=async(p,o)=>{const imgs=[];
  for(const b of [].concat((o&&o.images)||[]))imgs.push({mime:b.type||"image/jpeg",data:await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result.split(",")[1]);f.onerror=no;f.readAsDataURL(b)})});
  const{data:{session}}=await sb.auth.getSession();if(!session)throw{message:"Please log in again."};
  let r;try{r=await fetch(SB_URL+"/functions/v1/ai-proxy",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+session.access_token},body:JSON.stringify({prompt:p,images:imgs})})}catch(e){throw{code:"network",message:"Network error. Check your internet connection."}}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:j.code||"api",message:j.error||("Server error "+r.status)};return{text:j.text,truncated:false}};
 return wrapJson((p,o)=>call(p,o))}
function guestData(){let x={};try{x=JSON.parse(localStorage.getItem("mf2")||"{}")}catch(e){}S.hist=x.hist||[];S.bm=x.bm||[];S.dayq=x.dayq||{}}
async function pull(){try{
  const[q,r,b]=await Promise.all([sb.from("questions").select("*").order("id"),sb.from("results").select("*").eq("student_id",S.user.id).order("created_at",{ascending:false}).limit(50),sb.from("bookmarks").select("*").order("created_at",{ascending:false})]);
  const er=q.error||r.error||b.error;if(er)throw er;
  if(q.data.length){BANK.length=0;q.data.forEach(x=>BANK.push({sj:x.subject,q:x.question_text,opts:[x.option_a,x.option_b,x.option_c,x.option_d],ans:"ABCD".indexOf(x.correct_option),exp:x.explanation||"",src:"key",unv:false,tr:null,flags:[]}))}
  S.hist=r.data.map(x=>({cor:x.correct,wr:x.wrong,un:x.unattempted,ns:0,att:x.attempted,score:+x.score,max:+x.max_score,total:x.total_questions,acc:x.accuracy,time:x.time_seconds,sj:x.subject||"Mixed",mode:x.mode||"custom",ts:Date.parse(x.created_at)}));
  S.dayq={};S.hist.forEach(h=>{const k=ymd(new Date(h.ts));S.dayq[k]=(S.dayq[k]||0)+h.att});
  S.bm=b.data.map(x=>({q:x.question_text,opts:x.options,ans:x.correct_option,exp:x.explanation||"",sj:x.subject,src:"key",unv:false,tr:null,flags:[]}));
  S.cmsg="";S.dg.ai="ok";S.dg.img="ok"}catch(e){S.cmsg="Cloud load failed: "+cerr(e)}}
async function onSession(s){S.user=s?s.user:null;if(S.user)await pull();render()}

async function auth(kind){S.amsg="";if(!sb){S.amsg="Cloud is not available here.";return render()}
 S.busy=kind==="in"?"Logging in…":"Creating account…";render();
 try{const c={email:S.em.trim(),password:S.pw},r=kind==="in"?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);if(r.error)throw r.error;

  data.forEach(x=>{if(have.has(x.question_text))return;n++;const q={n:S.qs.length+1,q:x.question_text,opts:x.options,ans:x.correct_option,exp:x.explanation||"",src:x.answer_source,unv:false,tr:null,flags:[]};if(q.opts.length!==4||q.opts.some(o=>!o))q.flags.push("options≠4 / empty");if(q.ans==null)q.flags.push("no answer");S.qs.push(q)});
